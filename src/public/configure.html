<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StremList Configuration</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(148, 163, 184, 0.2);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .help-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .actions {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
      color: #fff;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.5);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
    }
    .link-box {
      margin-top: 16px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
      border: 1px dashed var(--border);
      font-size: 12px;
      word-break: break-all;
      color: var(--primary);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">StremList ⚡</h1>
      <p class="subtitle">Cloud offline streaming for Stremio via OpenList (115 & PikPak)</p>
    </div>

    <form id="configForm">
      <div class="form-group">
        <label for="openlistUrl">OpenList Server URL</label>
        <input type="text" id="openlistUrl" placeholder="http://127.0.0.1:5244" value="http://127.0.0.1:5244" required>
        <div class="help-text">Local or LAN IP where your OpenList/AList instance runs</div>
      </div>

      <div class="form-group">
        <label for="openlistToken">OpenList API Token</label>
        <input type="password" id="openlistToken" placeholder="OpenList Admin -> Manage -> API Token">
        <div class="help-text">Required if your OpenList instance has authentication enabled</div>
      </div>

      <div class="form-group">
        <label for="defaultDrive">Default Cloud Drive</label>
        <select id="defaultDrive">
          <option value="115" selected>115 Cloud (/115)</option>
          <option value="pikpak">PikPak (/pikpak)</option>
        </select>
        <div class="help-text">Primary storage target. If content already exists in either drive, it plays instantly.</div>
      </div>

      <div class="form-group">
        <label for="torrentioUrl">Torrentio URL</label>
        <input type="text" id="torrentioUrl" value="https://torrentio.strem.fun">
      </div>

      <div class="form-group">
        <label for="cometUrl">Comet URL</label>
        <input type="text" id="cometUrl" value="https://comet.elfhosted.com">
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="installBtn">⚡ Install Addon in Stremio</button>
        <button type="button" class="btn-secondary" id="copyBtn">📋 Copy Manifest URL</button>
      </div>

      <div class="link-box" id="linkBox"></div>
    </form>
  </div>

  <script>
    function base64urlEncode(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    function buildManifestUrl() {
      const config = {
        openlistUrl: document.getElementById('openlistUrl').value.trim(),
        openlistToken: document.getElementById('openlistToken').value.trim(),
        defaultDrive: document.getElementById('defaultDrive').value,
        torrentioUrl: document.getElementById('torrentioUrl').value.trim(),
        cometUrl: document.getElementById('cometUrl').value.trim()
      };

      const encoded = base64urlEncode(JSON.stringify(config));
      const host = window.location.host;
      const protocol = window.location.protocol;
      return `${protocol}//${host}/${encoded}/manifest.json`;
    }

    document.getElementById('installBtn').addEventListener('click', () => {
      const url = buildManifestUrl();
      const stremioUrl = url.replace(/^https?:/, 'stremio:');
      window.location.href = stremioUrl;
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const url = buildManifestUrl();
      const linkBox = document.getElementById('linkBox');
      linkBox.style.display = 'block';
      linkBox.textContent = url;
      try {
        await navigator.clipboard.writeText(url);
        alert('Manifest link copied to clipboard!');
      } catch (err) {
        // Fallback
      }
    });
  </script>
</body>
</html>
